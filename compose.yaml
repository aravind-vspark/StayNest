services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: staynest
      POSTGRES_USER: staynest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staynest -d staynest"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    environment: &appenv
      APP_ENV: ${APP_ENV:?Set APP_ENV explicitly to development or production}
      DATABASE_URL: postgresql+psycopg://staynest:${POSTGRES_PASSWORD}@db:5432/staynest
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /app/media
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  api:
    build: .
    env_file: .env
    environment: *appenv
    volumes: ["media_data:/app/media"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    build: .
    profiles: [push]
    env_file: .env
    environment: *appenv
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost:8000}
    ports: ["80:80", "443:443", "8000:8000"]
    volumes:
      [
        "./Caddyfile:/etc/caddy/Caddyfile:ro",
        "caddy_data:/data",
        "caddy_config:/config",
      ]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  media_data:
  caddy_data:
  caddy_config:
