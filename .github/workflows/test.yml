name: StayNest checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: staynest
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: staynest_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U staynest -d staynest_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://staynest:ci_only_password@localhost:5432/staynest_test
      DATABASE_URL: postgresql+psycopg://staynest:ci_only_password@localhost:5432/staynest_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.lock
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: node --check web/app.js && node --check web/sw.js
      - run: node --test tests/frontend.test.mjs
  mobile-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx esbuild mobile/bridge.js --bundle --format=iife --outfile=mobile/dist/native-bridge.js --target=es2022
      - run: npm audit --omit=dev
